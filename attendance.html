<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h2 { color: #333; }
    .student-info { font-size: 18px; margin-bottom: 10px; }
    video {
      width: 320px;
      height: 240px;
      border: 4px solid #4caf50;
      border-radius: 8px;
      margin: 20px 0;
    }
    button {
      padding: 10px 20px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover { background-color: #388e3c; }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 80%;
      max-width: 500px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
  <h2>Attendance Marking</h2>
  <div class="student-info">
    Student: <span id="studentNameCell">Student</span>
  </div>
  <video id="video" autoplay></video>
  <br>
  <button onclick="markAttendance()">Mark Attendance</button>
  <button onclick="exportCSV()">Export History as CSV</button>
  <button onclick="window.location.href='std_dashboard.html'">← Back to Dashboard</button>

  <h3>Attendance History</h3>
  <table id="historyTable">
    <tr>
      <th>Date</th>
      <th>Status</th>
    </tr>
    <!-- rows will be added by JS -->
  </table>

  <script>
const studentId = localStorage.getItem("studentId");
const name = localStorage.getItem("studentName") || "Student";
document.getElementById("studentNameCell").textContent = name;

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => { document.getElementById('video').srcObject = stream; })
  .catch(err => console.error("Camera error:", err));

// Fetch attendance history from backend
let history = [];
fetch(`http://localhost:8080/api/attendance/${studentId}`)
  .then(res => res.json())
  .then(data => { history = data; renderHistory(); })
  .catch(err => console.error("Failed to fetch history:", err));

function markAttendance() {
  const today = new Date().toISOString().split('T')[0];
  if (!history.some(item => item.date === today)) {
    const newRecord = { date: today, status: "Present" };
    // Save to backend
    fetch('http://localhost:8080/api/attendance', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ studentId, date: today, status: "Present" })
    }).then(() => {
      history.push(newRecord);
      renderHistory();
      alert("Attendance marked!");
    }).catch(err => {
      console.error("Failed to save attendance:", err);
      alert("Error saving attendance");
    });
  } else {
    alert("Today's attendance already marked.");
  }
}

function renderHistory() {
  const table = document.getElementById("historyTable");
  table.innerHTML = "<tr><th>Date</th><th>Status</th></tr>";
  history.forEach(item => {
    const row = table.insertRow(-1);
    row.insertCell(0).textContent = item.date;
    row.insertCell(1).textContent = item.status;
  });
}

function exportCSV() {
  if (history.length === 0) { alert("No history to export!"); return; }
  let csv = "Date,Status\n";
  history.forEach(item => { csv += `${item.date},${item.status}\n`; });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "attendance_history.csv";
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
