<!DOCTYPE html>
<html>
<head>
  <title>Login-Student Management Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb); /* whole window gradient */
      margin: 0;
      display: flex;
      flex-direction: column;          /* heading + login box stacked vertically */
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    .login-box {
      width: 300px;
      background: #e6f5ea;           /* light green background */
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    #login-status {
      color: red;
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h1>Student Management Portal</h1>
  <div class="login-box">
    <h2>Login</h2>
    <select id="role">
      <option value="student">Student</option>
      <option value="admin">Admin</option>
    </select>
    <input type="text" id="userid" placeholder="Enter your ID">
    <button onclick="login()">Login</button>
    <p id="login-status"></p>
  </div>

  <script>
    function login() {
      const userid = document.getElementById('userid').value.trim();
      const role = document.getElementById('role').value;

      if(userid === "") {
        document.getElementById('login-status').innerText = "Please enter your ID";
        return;
      }

      if(role === 'admin') {
        window.location.href = 'admin_dashboard.html';
      } else if(role === 'student') {
        window.location.href = 'std_dashboard.html';
      } else {
        document.getElementById('login-status').innerText = "Invalid role selected";
      }
    }
  </script>
</body>
</html>
