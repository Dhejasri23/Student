<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Font Awesome for icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #16a34a;
      --green-hover: #15803d;
      --gray: #6b7280;
      --bg: #ffffff;
      --text: #1f2937;
      --light-gray: #f3f4f6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: var(--green);
      color: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
    }
    .navbar-title { font-size: 1.8rem; font-weight: 600; }
    .profile-container {
      flex: 1;
      max-width: 500px;
      margin: 2rem auto;
      padding: 2rem;
      background: var(--light-gray);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .profile-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .profile-header h2 { color: var(--green); }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
    input {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    input:disabled { background-color: #e5e7eb; cursor: not-allowed; }
    .button-group {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
    }
    button {
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .edit-btn { background-color: var(--green); }
    .edit-btn:hover { background-color: var(--green-hover); }
    .logout-btn { background-color: #ef4444; }
    .logout-btn:hover { background-color: #dc2626; }
    footer {
      background-color: var(--green);
      color: white;
      text-align: center;
      padding: 0.8rem 0;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-title">Admin Profile</div>
    <div><i class="fas fa-user-circle"></i></div>
  </nav>

  <!-- Profile section -->
  <section class="profile-container">
    <div class="profile-header">
      <h2>Welcome, <span id="adminName">Admin</span></h2>
    </div>
    <form>
      <div class="form-group">
        <label for="staffName">Staff Name</label>
        <input type="text" id="staffName" value="John Doe" disabled>
      </div>
      <div class="form-group">
        <label for="staffId">Staff ID</label>
        <input type="text" id="staffId" value="ADM12345" disabled>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" value="9876543210" disabled>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" value="admin@example.com" disabled>
      </div>
      <div class="button-group">
        <button type="button" class="edit-btn" id="editSaveBtn">Edit</button>
        <button type="button" class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </form>
  </section>

  <footer>&copy; 2025 Smart Student Portal</footer>

  <script>
    // Set admin name from localStorage or default
    document.getElementById('adminName').textContent = localStorage.getItem('adminName') || 'Admin';

    let isEditable = false;

    document.getElementById('editSaveBtn').addEventListener('click', function() {
      const inputs = ['staffName', 'phone', 'email'];
      if (!isEditable) {
        // Enable editing
        inputs.forEach(id => document.getElementById(id).disabled = false);
        this.textContent = "Save";
        isEditable = true;
      } else {
        // Disable editing & save to localStorage
        inputs.forEach(id => document.getElementById(id).disabled = true);
        localStorage.setItem('adminProfile', JSON.stringify({
          staffName: document.getElementById('staffName').value,
          staffId: document.getElementById('staffId').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value
        }));
        alert("Profile updated!");
        this.textContent = "Edit";
        isEditable = false;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
      localStorage.removeItem('adminName');
      localStorage.removeItem('adminProfile');
      window.location.href = 'index.html';
    });

    // Load saved profile on page load
    const saved = JSON.parse(localStorage.getItem('adminProfile') || '{}');
    if (saved.staffName) document.getElementById('staffName').value = saved.staffName;
    if (saved.staffId) document.getElementById('staffId').value = saved.staffId;
    if (saved.phone) document.getElementById('phone').value = saved.phone;
    if (saved.email) document.getElementById('email').value = saved.email;
  </script>
</body>
</html>
